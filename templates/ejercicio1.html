<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Notas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>

<div class="contenedor">
    <h1>Formulario de Notas</h1>

    <form method="POST">

        <label>Nota 1:</label>
        <input type="number" name="nota1" min="10" max="70" required>

        <label>Nota 2:</label>
        <input type="number" name="nota2" min="10" max="70" required>

        <label>Nota 3:</label>
        <input type="number" name="nota3" min="10" max="70" required>

        <label>Asistencia (%):</label>
        <input type="number" name="asistencia" min="0" max="100" required>

        <button type="submit">Enviar</button>

    </form>

    {% if promedio is not none %}
        <h2>Promedio: {{ "%.1f"|format(promedio) }}</h2>
        <h2>{{ estado }}</h2>
    {% endif %}

    <a href="{{ url_for('inicio') }}">Volver al menú</a>

</div>

</body>
</html>
