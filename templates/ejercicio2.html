
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 2 - Nombres</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>

<div class="contenedor">

    <h1>Comparación de nombres</h1>

    <p>Ingresa tres nombres diferentes:</p>

    <form method="POST">

        <label>Primer nombre:</label>
        <input type="text" name="nombre1" required>

        <label>Segundo nombre:</label>
        <input type="text" name="nombre2" required>

        <label>Tercer nombre:</label>
        <input type="text" name="nombre3" required>

        <button type="submit">Comparar nombres</button>

    </form>

    {% if nombre_mayor is not none %}
        <h2>Nombre con más caracteres: {{ nombre_mayor }}</h2>
        <h2>Cantidad de caracteres: {{ cantidad }}</h2>
    {% endif %}

    <a href="{{ url_for('inicio') }}">Volver al menú</a>

</div>

</body>
</html>
